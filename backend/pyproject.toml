[project]
name = "pagi-backend"
version = "0.1.0"
description = "PAGI — self-hosted single-tenant AI agent gateway (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "pydantic-settings>=2.6",
    "litellm>=1.55",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "structlog>=24.4",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
    "mcp>=1.1",
    "alembic>=1.13",
    "pillow>=10.2",
    "numpy>=1.26",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]
# RAG extras — optional, degrade gracefully when absent (SPEC §14.10):
#   rag-vi:     Vietnamese word segmentation for BM25 (vi_segmentation)
#   rag-rerank: local cross-encoder reranker (rerank_mode=cross_encoder, ~2GB)
rag-vi = ["underthesea>=6.8"]
rag-rerank = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
